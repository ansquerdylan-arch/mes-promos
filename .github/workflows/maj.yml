name: Mise à jour des promos

on:
  schedule:
    - cron: "17 4 * * *"   # tous les jours vers 5 h / 6 h (heure de Paris)
  workflow_dispatch:        # bouton « Run workflow » pour forcer une mise à jour

permissions:
  contents: write

jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Récupérer les promos
        env:
          TZ: Europe/Paris
        run: python maj_promos.py
      - name: Alertes (produits surveillés, opérations du jour)
        env:
          TZ: Europe/Paris
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python alertes.py
      - name: Enregistrer si ça a changé
        run: |
          git config user.name "maj-promos"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add promos.json rappels.ics historique.json alertes_envoyees.json
          git diff --cached --quiet || (git commit -m "Promos du $(TZ=Europe/Paris date +%d/%m)" && git pull --rebase -q && git push)
