name: Diagnostic des sources

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Adresses à tester (séparées par des espaces) ; vide = essai complet sans rien enregistrer"
        required: false
        default: ""

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tester
        env:
          URLS: ${{ github.event.inputs.urls }}
          TZ: Europe/Paris
        run: |
          if [ -n "$URLS" ]; then python diag.py $URLS; else python maj_promos.py --essai; fi
