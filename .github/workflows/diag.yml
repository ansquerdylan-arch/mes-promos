name: Diagnostic des sources

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Adresses à tester (séparées par des espaces) ; vide = essai complet sans rien enregistrer"
        required: false
        default: ""
      brut:
        description: "oui = pages telles quelles dans la branche diag-brut ; essai = mise à jour complète dans diag-brut ; nettoyer = supprimer diag-brut et les branches essai-* ; firebase = vérifier les comptes (urls = CLE PROJET) ; alertes = lancer les alertes seules (règles, clés, notifications)"
        required: false
        default: "non"

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Outils images (essai complet)
        if: github.event.inputs.urls == ''
        run: |
          sudo apt-get update -qq > /dev/null 2>&1 || true
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-fra > /dev/null 2>&1 || true
          pip install -q pillow || true
      - name: Tester
        env:
          URLS: ${{ github.event.inputs.urls }}
          TZ: Europe/Paris
          FIREBASE_COMPTE: ${{ github.event.inputs.brut == 'alertes' && (secrets.FIREBASE_COMPTE || secrets.FIRECOMPT) || '' }}
          LONGUEURS: ${{ github.event.inputs.brut == 'secret' && format('{0}|{1}', (secrets.FIREBASE_COMPTE || secrets.FIRECOMPT) != '', vars.FIREBASE_COMPTE != '') || '' }}
        run: |
          if [ "${{ github.event.inputs.brut }}" = "nettoyer" ]; then
            git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" --delete diag-brut || true
            for b in $(git ls-remote --heads origin 'essai-*' | sed 's#.*refs/heads/##'); do
              git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" --delete "$b" || true
            done
          elif [ "${{ github.event.inputs.brut }}" = "oui" ]; then
            python outils/aspirer.py $URLS
            cd brut && git init -q -b diag-brut && git add -A
            git -c user.name="diag" -c user.email="diag@users.noreply.github.com" commit -q -m "pages brutes"
            git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag-brut
          elif [ "${{ github.event.inputs.brut }}" = "firebase" ]; then python outils/verif_firebase.py $URLS
          elif [ "${{ github.event.inputs.brut }}" = "secret" ]; then echo "secret FIREBASE_COMPTE présent | variable FIREBASE_COMPTE présente : $LONGUEURS"
          elif [ "${{ github.event.inputs.brut }}" = "alertes" ]; then pip install -q google-auth requests pywebpush && python alertes.py
          elif [ -n "$URLS" ]; then python diag.py $URLS --routes
          elif [ "${{ github.event.inputs.brut }}" = "essai" ]; then
            mkdir -p essai && cp promos.json historique.json essai/ && cp -r offres pages essai/ 2>/dev/null; cp notes.json ocr.json leclerc.json essai/ 2>/dev/null || true
            PROMOS_DATA=essai python maj_promos.py 2>&1 | tee essai/journal.txt && PROMOS_DATA=essai python -c "import maj_promos as m, json; d=m.charger_donnees(); print('offres', len(d['offres']))"
            cd essai && git init -q -b diag-brut && git add -A
            git -c user.name="diag" -c user.email="diag@users.noreply.github.com" commit -q -m "essai complet"
            git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag-brut
          else python maj_promos.py --essai; fi
