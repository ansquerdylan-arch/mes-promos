name: Diagnostic des sources

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Adresses à tester (séparées par des espaces) ; vide = essai complet sans rien enregistrer"
        required: false
        default: ""
      brut:
        description: "oui = enregistrer les pages telles quelles dans la branche diag-brut"
        required: false
        default: "non"

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tester
        env:
          URLS: ${{ github.event.inputs.urls }}
          TZ: Europe/Paris
        run: |
          if [ "${{ github.event.inputs.brut }}" = "oui" ]; then
            python outils/aspirer.py $URLS
            cd brut && git init -q -b diag-brut && git add -A
            git -c user.name="diag" -c user.email="diag@users.noreply.github.com" commit -q -m "pages brutes"
            git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag-brut
          elif [ -n "$URLS" ]; then python diag.py $URLS --routes; else python maj_promos.py --essai; fi
